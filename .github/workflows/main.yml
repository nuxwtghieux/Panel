
name: Build SNOW PANEL APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q SnowPanel_Android10_Fixed.zip -d source
          test -f source/SnowPanel_Java/gradlew
          sed -i 's/targetSdk 28/targetSdk 29/' source/SnowPanel_Java/app/build.gradle

      - name: Build APK
        run: |
          cd source/SnowPanel_Java
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNOW-PANEL-debug-APK
          path: source/SnowPanel_Java/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
